services:
  db:
    image: postgis/postgis:17-3.5
    # The upstream image currently publishes amd64 only for this tag.
    # Docker Desktop/OrbStack on Apple Silicon runs it through emulation.
    platform: linux/amd64
    environment:
      POSTGRES_DB: michi
      POSTGRES_USER: michi
      POSTGRES_PASSWORD: michi
    ports:
      - "${DB_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U michi -d michi"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - michi-postgres:/var/lib/postgresql/data

volumes:
  michi-postgres:
